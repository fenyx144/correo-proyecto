services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./sql/initdb:/docker-entrypoint-initdb.d:ro

  odoo:
    image: odoo:18
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons

  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      ODOO_URL: http://odoo:8069
      ODOO_PUBLIC_URL: ${ODOO_PUBLIC_URL}
      ODOO_DB: ${ODOO_DB}
      ODOO_USER: ${ODOO_USER}
      ODOO_API_KEY: ${ODOO_API_KEY}
      SLACK_CANAL: ${SLACK_CANAL}
      ALERTAS_CORREO: ${ALERTAS_CORREO}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows:/workflows

  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: odoo
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      JAVA_TIMEZONE: ${TZ}
      MB_SITE_LOCALE: es

  tablero:
    build: ./tablero
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ}
      PGHOST: db
      PGDATABASE: ${ODOO_DB}
      PGUSER: lector
      PGPASSWORD: ${LECTOR_PASSWORD}
      METABASE_URL: ${MB_URL}
    volumes:
      - ./sql:/app/sql:ro

volumes:
  db-data:
  odoo-data:
  n8n-data:
